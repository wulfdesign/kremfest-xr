<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <style>
      .laurel-text { font-family: 'Georgia', 'Times New Roman', serif; text-anchor: middle; font-weight: bold; }
      .laurel-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-anchor: middle; font-weight: 800; letter-spacing: 3px; }
    </style>
  </defs>
  <!-- Classical Official Selection Laurels: KremFest XR 2026 -->
  <g fill="#FFFFFF">
    <!-- Left Laurel Branch -->
    <path d="M 600,530 C 350,530 240,430 240,310 C 240,190 350,90 560,80" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <!-- Right Laurel Branch -->
    <path d="M 600,530 C 850,530 960,430 960,310 C 960,190 850,90 640,80" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    
    <text x="600" y="180" class="laurel-sans" font-size="24">OFFICIAL SELECTION</text>
    <text x="600" y="225" class="laurel-sans" font-size="20">★ ★ ★</text>
    <text x="600" y="290" class="laurel-text" font-size="52">KREMFEST XR</text>
    <text x="600" y="375" class="laurel-text" font-size="76">2026</text>
    <text x="600" y="435" class="laurel-sans" font-size="20">SEATTLE, WA • USA</text>
  </g>
</svg>